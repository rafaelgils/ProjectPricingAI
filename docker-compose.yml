# Ambiente local (ADR-009): um contêiner por camada, em HTTP.
# Portas publicadas (plano, P7): frontend 3000, kong 8000, keycloak 8080.
# backend e mongodb ficam só na rede interna.
name: project-pricing

services:
  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?defina MONGO_ROOT_USER no .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?defina MONGO_ROOT_PASSWORD no .env}
      MONGO_APP_DATABASE: ${MONGO_APP_DATABASE:?defina MONGO_APP_DATABASE no .env}
      MONGO_APP_USER: ${MONGO_APP_USER:?defina MONGO_APP_USER no .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?defina MONGO_APP_PASSWORD no .env}
    volumes:
      - mongodb-dados:/data/db
      - ./infra/mongodb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?defina KEYCLOAK_ADMIN_USER no .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?defina KEYCLOAK_ADMIN_PASSWORD no .env}
      # Placeholders do realm-precificacao.json, resolvidos na importação
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?defina KEYCLOAK_ADMIN_CLIENT_SECRET no .env}
      KEYCLOAK_TEST_USER_PASSWORD: ${KEYCLOAK_TEST_USER_PASSWORD:?defina KEYCLOAK_TEST_USER_PASSWORD no .env}
      REALM_RSA_PRIVATE_KEY: ${REALM_RSA_PRIVATE_KEY:?rode ./scripts/gerar-chave-realm.sh}
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # A imagem não tem curl; a checagem usa o /dev/tcp do bash na porta de gerenciamento.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  backend:
    build:
      context: ./backend
    image: project-pricing/backend:0.1.0
    environment:
      ConnectionStrings__MongoDB: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongodb:27017/${MONGO_APP_DATABASE}?authSource=${MONGO_APP_DATABASE}
      # O "iss" dos tokens é a URL pública; os metadados e as chaves são lidos pela rede interna (plano, F2).
      Keycloak__UrlPublica: http://localhost:8080/realms/precificacao
      Keycloak__UrlInterna: http://keycloak:8080/realms/precificacao
      Keycloak__ExigirHttpsMetadata: "false"
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      # A imagem aspnet não tem curl e o /bin/sh dela (dash) não tem /dev/tcp; por isso o bash.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q 'Healthy' <&3
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kong:
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    ports:
      - "8000:8000"
    volumes:
      - ./infra/kong/kong.yml:/kong/declarative/kong.yml:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    image: project-pricing/frontend:0.1.0
    environment:
      # Lidos na subida e gravados no /env.js (plano, P5)
      API_URL: http://localhost:8000
      OIDC_AUTHORITY: http://localhost:8080/realms/precificacao
      OIDC_CLIENT_ID: precificacao-frontend
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb-dados:
