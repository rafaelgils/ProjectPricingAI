server {
    # Porta acima de 1024: o Nginx roda sem root (plano, F9)
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Cabeçalhos de segurança gerados na subida (40-gerar-env.sh). O add_header de um bloco
    # location substitui os do server, por isso o include se repete em cada location.
    include /etc/nginx/gerado/seguranca.conf;

    # SPA: rotas do react-router caem no index.html
    location / {
        include /etc/nginx/gerado/seguranca.conf;
        try_files $uri $uri/ /index.html;
    }

    # Configuração gerada na subida: nunca em cache, para a troca de ambiente valer na hora
    location = /env.js {
        include /etc/nginx/gerado/seguranca.conf;
        add_header Cache-Control "no-store";
    }

    location = /index.html {
        include /etc/nginx/gerado/seguranca.conf;
        add_header Cache-Control "no-cache";
    }

    # Arquivos com hash no nome podem ficar em cache por muito tempo
    location /assets/ {
        include /etc/nginx/gerado/seguranca.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
